<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>爱逛GIT</title>
<style>
:root{--acc:#2563eb;--accBg:#e5efff;--ink:#1a1a1a;--sub:#6b7280;--line:#eee;--bg:#f6f7f9;--card:#fff;--radius:14px;--shadow:0 1px 4px rgba(0,0,0,.07);--fs:1}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 14px}
.bar{display:flex;gap:8px 10px;align-items:center;max-width:1400px;margin:0 auto;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;flex:0 0 auto}
.logo{font-size:20px;font-weight:800;color:var(--acc);white-space:nowrap;cursor:pointer}
.logo small{color:var(--sub);font-weight:400;font-size:12px;margin-left:6px}
.searchwrap{flex:1 1 240px;min-width:150px;display:flex;position:relative}
#q{flex:1;min-width:0;padding:9px 36px 9px 14px;border:1px solid var(--line);border-radius:999px;font-size:16px;background:#f2f3f5;outline:none}
#qClr{display:none;position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:#e5e7eb;color:#6b7280;border-radius:999px;width:28px;height:28px;font-size:16px;cursor:pointer;padding:0;line-height:1}
#q:focus{background:#fff;border-color:var(--acc)}
/* 工具带：一行内横滑，绝不折成多行浪费竖向空间（手机/Ipad 通用） */
.tools{display:flex;gap:6px;align-items:center;flex:1 1 auto;justify-content:flex-end;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tools::-webkit-scrollbar{display:none}
.tabs{display:flex;gap:4px;flex:0 0 auto}
.tabs button{border:none;background:none;padding:8px 12px;font-size:14px;color:var(--sub);border-radius:999px;cursor:pointer}
.tabs button.on{background:var(--accBg);color:var(--acc);font-weight:700}
#favBtn{font-size:17px;padding:8px 10px;border-radius:999px;border:none;background:none;cursor:pointer;flex:0 0 auto}
#favBtn.on{background:var(--accBg)}
#refresh{font-size:14px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--sub);position:relative;flex:0 0 auto}
#newBadge{display:none;position:absolute;top:-7px;right:-9px;background:#ef4444;color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 6px;line-height:1.5;box-shadow:0 1px 3px rgba(0,0,0,.2)}
#meta{font-size:11px;color:var(--sub);width:100%}
main{margin:0 auto;padding:12px 10px 60px;max-width:1600px}
/* 全端单列纵向瀑布流：手机/平板/电脑统一一张卡一行，一直往下拉 */
#flow{width:100%;margin:0;display:flex;flex-direction:column;gap:10px}
/* 卡片纵向结构：头部（头像+名字/owner）横排一行，内容全宽铺在下 —— 不再有左侧栏留白 */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;position:relative;display:flex;flex-direction:column}
.head{display:flex;align-items:center;gap:10px;margin-bottom:9px;padding-right:36px}
.head img{width:44px;height:44px;border-radius:11px;flex:0 0 auto}
.hi{min-width:0;flex:1}
.own{font-size:calc(11px*var(--fs));color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{min-width:0}
.name{display:block;font-size:calc(16px*var(--fs));font-weight:700;word-break:break-all;color:var(--ink);text-decoration:none}
.name:hover{color:var(--acc)}
.desc{font-size:calc(13px*var(--fs));color:var(--sub);line-height:1.55;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.chip{background:#f2f3f5;border-radius:999px;padding:2px 8px;font-size:calc(11px*var(--fs));color:var(--sub)}
.foot{display:flex;align-items:center;gap:10px;font-size:calc(12px*var(--fs));color:var(--sub);flex-wrap:wrap}
.lang::before{content:"●";margin-right:3px;font-size:10px}
.today{color:var(--acc);font-weight:700}
.srcs{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:8px}
.srctag{background:#f2f3f5;border-radius:4px;padding:1px 5px;font-size:10px;color:var(--sub)}
.pushed{font-size:10px;color:#b6bcc7}
.heart{position:absolute;top:10px;right:10px;font-size:18px;color:#d1d5db;background:none;border:none;cursor:pointer;padding:4px}
.heart.on{color:var(--acc)}
.cnbody{margin-top:10px;background:#f0f6ff;border:1px solid #cfe0ff;border-radius:10px;padding:10px 12px;font-size:calc(13px*var(--fs));line-height:1.7;color:#24405e;white-space:pre-wrap;word-break:break-word}
.fsb{font-size:14px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--sub);flex:0 0 auto;white-space:nowrap}
.fsb.on{background:var(--accBg);color:var(--acc);border-color:var(--acc);font-weight:700}
.ghstar{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 10px;font-size:calc(11px*var(--fs));color:var(--sub);cursor:pointer}
.ghstar.on{color:var(--acc);border-color:var(--acc);font-weight:700}
.openlink{display:inline-block;background:var(--acc);color:#fff !important;padding:9px 16px;border-radius:10px;font-size:calc(14px*var(--fs));font-weight:700;text-decoration:none;margin:4px 8px 4px 0}
.lnks{font-size:calc(12px*var(--fs));color:var(--sub)}
.lnks a{color:var(--sub);margin-left:4px;text-decoration:underline;padding:8px 8px;display:inline-block}
.lnks a.cur{color:var(--acc);font-weight:700}
#sentinel{height:60px;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px;text-align:center;padding:0 20px}
/* 仅电脑宽桌面（≥1400px）卡片转横排；手机/平板（含 iPad Pro 横屏 1366）统一竖排 */
@media(min-width:1400px){
  .card{flex-direction:row;gap:18px;align-items:flex-start;padding:16px 18px}
  .head{flex:0 0 250px;flex-direction:column;align-items:flex-start;gap:8px;margin-bottom:0;padding-right:0}
  .head img{width:56px;height:56px;border-radius:13px}
  .main{flex:1}
}
/* iPad 竖屏及以下：控件收成独立一行、可横滑，不再折成多行吃屏幕 */
@media(max-width:1023px){
  .tools{flex:1 1 100%;order:9;justify-content:flex-start;padding:8px 0 2px}
  #meta{order:10}
}
/* 手机：压留白、放大可用宽度 */
@media(max-width:480px){
  header{padding:8px 10px}
  main{padding:10px 8px 56px}
  .card{padding:12px;border-radius:12px}
  .head img{width:40px;height:40px;border-radius:10px}
  .logo{font-size:19px}
  .logo small{display:none}
  .tabs button{padding:8px 10px}
}
.pgsw{display:flex;gap:3px;background:#f2f3f5;border-radius:999px;padding:3px;margin-left:10px;flex:0 0 auto}.pgsw a{padding:6px 14px;border-radius:999px;font-size:13px;color:var(--sub);text-decoration:none;font-weight:600}.pgsw a.on{background:#fff;color:var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.12)}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><div class="logo" id="homeBtn"><svg style="width:26px;height:26px;border-radius:7px;vertical-align:-5px;margin-right:7px" viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="#2563eb"/><text x="31" y="43" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="800" letter-spacing="-1" fill="#fff" text-anchor="middle">AG</text></svg> title="回到首页">爱逛GIT<small>GitHub 好物</small></div><nav class="pgsw"><a href="/" class="on">项目</a><a href="/skills.html">Skill</a></nav></div>
    <div class="searchwrap">
      <input id="q" placeholder="搜项目 / 简介…" autocomplete="off">
      <button id="qClr" title="清除搜索">×</button>
    </div>
    <button id="favBtn" title="我的收藏">♥</button>
    <div class="tools">
      <a href="/skills.html" class="fsb" style="text-decoration:none;display:inline-block" title="去看全网 Skill 好物">🧩 Skill</a>
      <div class="tabs">
        <button data-sort="hot" class="on">最热</button>
        <button data-sort="rising">上升最快</button>
        <button data-sort="new">最新</button>
        <button data-sort="stars">星标</button>
      </div>
      <button id="ghBtn" class="fsb" title="只看 GitHub 好物">GitHub</button>
      <button id="srcBtn" class="fsb" title="只看 Gitee 好物">Gitee</button>
      <button id="refresh">↻ 抓新货<b id="newBadge"></b></button>
      <button id="fsBtn" class="fsb">字号 大</button>
    </div>
    <div id="meta">加载中…</div>
  </div>
</header>
<main>
  <div id="flow"></div>
  <div id="sentinel">加载中…</div>
</main>
<script>
/* 纯静态前端：一次性拉 feed.json 全量 → 客户端搜索/排序/分页/收藏/解读。
   收藏存 localStorage；中文解读走 cn.json 懒加载；头像走 /api/avatar 边缘代理（可选 Pages Function）。
   全站无需任何常驻后端进程，可直接放 Cloudflare Pages。 */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n>=10000?(n/10000).toFixed(1)+'w':n>=1000?(n/1000).toFixed(1)+'k':n;

const S={all:[],meta:null,cn:{},cnLoading:null,offset:0,limit:30,sort:'hot',q:'',fav:0,src:'',
  view:[],lnk:localStorage.ag_lnk||'github'};
/* 收藏与「越逛越懂你」偏好都落在本地浏览器 */
const favSet=new Set(JSON.parse(localStorage.ag_favs||'[]'));
const prefs=JSON.parse(localStorage.ag_prefs||'{}');
const saveFavs=()=>localStorage.ag_favs=JSON.stringify([...favSet]);
const savePrefs=()=>localStorage.ag_prefs=JSON.stringify(prefs);
function bumpPrefs(it,delta){
  const tags=[it.language,...(it.topics||[])].filter(Boolean);
  tags.forEach(t=>{prefs[t]=Math.max(0,(prefs[t]||0)+delta);if(!prefs[t])delete prefs[t]});
  savePrefs();
}

/* ---------- 头像：走边缘代理（u= 原始头像地址），裂图自动退回首字母彩色块 ---------- */
function avSrc(it){return '/api/avatar/'+encodeURIComponent(it.full_name)+(it.avatar?'?u='+encodeURIComponent(it.avatar):'')}
function letterSvg(name){
  const ch=(name||'?').slice(0,1).toUpperCase();
  const hue=(ch.charCodeAt(0)*47)%360;
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='52' height='52'><rect width='52' height='52' rx='12' fill='hsl(${hue},58%,68%)'/><text x='26' y='36' font-size='26' text-anchor='middle' font-family='sans-serif' fill='#fff'>${esc(ch)}</text></svg>`;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}

/* ---------- 链接线路（直连/镜像/代理）：按 meta 配置实时拼接 ---------- */
function linksOf(it){
  const m=S.meta||{};
  const isGh=it.url.startsWith('https://github.com');
  const mirror=(isGh&&m.gh_mirror)?it.url.replace('https://github.com',m.gh_mirror):it.url;
  const proxy=m.gh_proxy?m.gh_proxy+'/'+it.url:it.url;
  return {u1:it.url,u2:mirror,u3:proxy,isGh};
}
function applyLnk(el){
  const a=el.querySelector('[data-role=open]');if(!a)return;
  a.href={github:el.dataset.u1,mirror:el.dataset.u2,proxy:el.dataset.u3}[S.lnk]||el.dataset.u1;
  el.querySelectorAll('.lnks a').forEach(x=>x.classList.toggle('cur',x.dataset.l===S.lnk));
}

/* ---------- 中文解读：cn.json 懒加载，命中即铺 ---------- */
function loadCn(){
  if(S.cnLoading)return S.cnLoading;
  S.cnLoading=fetch('data/cn.json').then(r=>r.json()).then(d=>S.cn=d||{}).catch(()=>S.cn={});
  return S.cnLoading;
}
function showCn(el,text){const b=el.querySelector('.cnbody');if(!b)return;b.textContent=text;b.style.display='block'}
function maybeCn(el){
  if(el.dataset.cnReq)return;el.dataset.cnReq='1';
  loadCn().then(()=>{
    const t=S.cn[el.dataset.fn];
    if(t){showCn(el,t);return}
    const d=el.querySelector('.desc');
    const txt=d?d.textContent.trim():'';
    const b=el.querySelector('.cnbody');
    if(b&&txt&&txt!=='（暂无简介）'){b.textContent='【原文简介】（中文解读后台整理中，改天再来即是译文）\n'+txt;b.style.display='block'}
  });
}
const cnIO=new IntersectionObserver(es=>{es.forEach(e=>{
  if(e.isIntersecting){maybeCn(e.target);cnIO.unobserve(e.target)}
})},{rootMargin:'150px'});

/* ---------- 卡片 ---------- */
function card(it){
  const el=document.createElement('div');el.className='card';el.dataset.fn=it.full_name;
  const L=linksOf(it);
  const on=favSet.has(it.full_name);
  el.innerHTML=`<button class="heart ${on?'on':''}">${on?'♥':'♡'}</button>
  <div class="head"><img src="${esc(avSrc(it))}" loading="lazy" alt="">
    <div class="hi"><a class="name" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.name)}</a><div class="own">${esc(it.owner)}</div></div>
  </div>
  <div class="main">
  <div class="desc">${esc(it.description)||'（暂无简介）'}</div>
  ${it.topics&&it.topics.length?`<div class="chips">${it.topics.slice(0,6).map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>`:''}
  <div class="foot">
    ${it.language?`<span class="lang">${esc(it.language)}</span>`:''}
    <span>★ ${fmt(it.stars)}</span>
    <span>⑂ ${fmt(it.forks)}</span>
    ${it.today_stars?`<span class="today">+${fmt(it.today_stars)} 今日</span>`:''}
  </div>
  <div class="srcs">${(it.sources||[]).map(s=>`<span class="srctag">${esc(s)}</span>`).join('')}${it.gitee_url?`<a class="srctag" style="text-decoration:underline" href="${esc(it.gitee_url)}" target="_blank" rel="noopener">Gitee 镜像↗</a>`:''}${it.pushed_at?`<span class="pushed">更新 ${esc(it.pushed_at.slice(0,10))}</span>`:''}</div>
  <div class="srcs">${L.isGh?`<a class="openlink" data-role="open" href="${esc(L.u1)}" target="_blank" rel="noopener">原项目 →</a><span class="lnks">切换线路:<a data-l="github" href="${esc(L.u1)}" target="_blank" rel="noopener">直连</a><a data-l="mirror" href="${esc(L.u2)}" target="_blank" rel="noopener">镜像</a><a data-l="proxy" href="${esc(L.u3)}" target="_blank" rel="noopener">代理</a></span><button class="ghstar" title="star 到我的 GitHub 账号">☆ 星到GitHub</button>`:`<a class="openlink" href="${esc(it.url)}" target="_blank" rel="noopener">Gitee 原项目 →</a>`}</div>
  <div class="cnbody" style="display:none"></div>
  </div>`;
  const im=el.querySelector('.head img');
  im.onerror=()=>{im.onerror=null;im.src=letterSvg(it.owner||it.name)};
  const h=el.querySelector('.heart');
  h.onclick=()=>{
    const nowOn=!favSet.has(it.full_name);
    if(nowOn){favSet.add(it.full_name);bumpPrefs(it,1)}else{favSet.delete(it.full_name);bumpPrefs(it,-1)}
    saveFavs();
    h.classList.toggle('on',nowOn);h.textContent=nowOn?'♥':'♡';
    if(S.fav&&!nowOn)el.remove();
  };
  const g=el.querySelector('.ghstar');
  if(g)g.onclick=async()=>{
    const on2=g.dataset.on!=='1';
    try{
      const r=await fetch('/api/gh_star',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:it.full_name,on:on2})});
      const d=await r.json();
      if(d.error){alert(d.error);return}
      g.dataset.on=on2?'1':'0';g.textContent=on2?'★ 已星到GitHub':'☆ 星到GitHub';g.classList.toggle('on',on2);
      bumpPrefs(it,on2?2:-2);
    }catch(e){alert('星标服务不可用：静态部署需启用 Pages Function 并配置 GitHub 令牌')}
  };
  if(L.isGh){el.dataset.u1=L.u1;el.dataset.u2=L.u2;el.dataset.u3=L.u3;applyLnk(el)}
  el.querySelectorAll('.lnks a').forEach(a=>{
    a.onclick=()=>{S.lnk=a.dataset.l;localStorage.ag_lnk=S.lnk;document.querySelectorAll('.card').forEach(applyLnk)};
  });
  cnIO.observe(el);
  return el;
}
function addCard(it){$('#flow').appendChild(card(it))}

/* ---------- 四级字号 ---------- */
const FS=[1,1.15,1.32,1.5],FSN=['标准','大','加大','特大'];
if(localStorage.ag_fsVer!=='2'){localStorage.ag_fs='1';localStorage.ag_fsVer='2'}
S.fs=Math.min(3,Math.max(0,+(localStorage.ag_fs??1)));
function applyFs(){document.documentElement.style.setProperty('--fs',FS[S.fs]);$('#fsBtn').textContent='字号 '+FSN[S.fs]}
$('#fsBtn').onclick=()=>{S.fs=(S.fs+1)%4;localStorage.ag_fs=S.fs;applyFs()};

/* ---------- 过滤 + 排序 + 分页（全在客户端） ---------- */
function prefBonus(it){let b=0;for(const t of [it.language,...(it.topics||[])].filter(Boolean)){const w=prefs[t];if(w)b+=Math.min(w,10)*25}return b}
const CMPS={
  hot:(a,b)=>(b.today_stars+prefBonus(b))-(a.today_stars+prefBonus(a))||b.stars-a.stars,
  rising:(a,b)=>(b.today_stars/Math.max(b.stars,1))-(a.today_stars/Math.max(a.stars,1))||b.today_stars-a.today_stars,
  new:(a,b)=>String(b.fetched_at).localeCompare(String(a.fetched_at)),
  stars:(a,b)=>b.stars-a.stars,
};
function computeList(){
  const q=S.q.toLowerCase();
  S.list=S.all.filter(it=>{
    if(S.src==='GitHub'&&!it.url.startsWith('https://github.com'))return false;
    if(S.src==='Gitee'&&!it.full_name.startsWith('gitee/'))return false;
    if(S.fav&&!favSet.has(it.full_name))return false;
    if(q){
      const hay=(it.full_name+' '+it.description+' '+(it.topics||[]).join(' ')+' '+(S.cn[it.full_name]||'')).toLowerCase();
      if(!hay.includes(q))return false;
    }
    return true;
  });
}
function renderPage(){
  if(!S.view)return;
  if(S.offset>=S.view.length){$('#sentinel').textContent=S.view.length?`到底啦，共 ${S.view.length} 个宝贝`:'这里空空如也，去抓点新货吧';return}
  const next=S.view.slice(S.offset,S.offset+S.limit);
  next.forEach(addCard);
  S.offset+=next.length;
  if(S.offset<S.view.length){$('#sentinel').textContent='下拉加载更多…'}
  else{$('#sentinel').textContent=`到底啦，共 ${S.view.length} 个宝贝`}
}
function reset(){S.offset=0;$('#flow').innerHTML='';computeList();S.view=S.list.slice().sort(CMPS[S.sort]||CMPS.hot);renderPage()}

/* ---------- 顶部控件 ---------- */
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');S.sort=b.dataset.sort;reset();
});
let qt;$('#q').oninput=e=>{$('#qClr').style.display=e.target.value?'block':'none';clearTimeout(qt);qt=setTimeout(()=>{S.q=e.target.value.trim();reset()},350)};
$('#qClr').onclick=()=>{$('#q').value='';$('#qClr').style.display='none';S.q='';reset()};
$('#favBtn').onclick=()=>{S.fav=S.fav?0:1;$('#favBtn').classList.toggle('on',!!S.fav);reset()};
function setSrc(v){S.src=S.src===v?'':v;$('#ghBtn').classList.toggle('on',S.src==='GitHub');$('#srcBtn').classList.toggle('on',S.src==='Gitee');reset()}
$('#ghBtn').onclick=()=>setSrc('GitHub');
$('#srcBtn').onclick=()=>setSrc('Gitee');
$('#homeBtn').onclick=()=>{if(S.meta)localStorage.ag_total=S.meta.total;location.reload()};

/* 新货红点：本次库内总数比上次浏览多时，抓新货按钮右上角亮 +N */
function setBadge(n){const b=$('#newBadge');if(n>0){b.textContent='+'+n;b.style.display='inline-block'}else b.style.display='none'}

/* 后台自动探测线路：直连→镜像→代理，谁先通用谁 */
async function autoLink(m){
  const cands=[['github','https://github.com']];
  if(m.gh_mirror)cands.push(['mirror',m.gh_mirror]);
  if(m.gh_proxy)cands.push(['proxy',m.gh_proxy]);
  for(const[k,u]of cands){
    try{
      const c=new AbortController(),t=setTimeout(()=>c.abort(),4500);
      await fetch(u,{mode:'no-cors',signal:c.signal,cache:'no-store'});
      clearTimeout(t);
      S.lnk=k;localStorage.ag_lnk=k;
      document.querySelectorAll('.card').forEach(applyLnk);
      return;
    }catch(e){/* 此路不通，试下一方案 */}
  }
}

/* 数据缓存：localStorage 存上一份 feed，打开即秒铺；后台拉新，版本变了才重铺（保持滚动位置） */
const FEED_KEY='ag_feed_v1';
function loadCached(){try{const d=JSON.parse(localStorage.getItem(FEED_KEY));if(d&&d.items&&d.items.length){S.all=d.items;S.meta=d.meta||{};return true}}catch(e){}return false}
async function loadFeed(){
  const r=await fetch('data/feed.json',{cache:'no-store'});
  const d=await r.json();
  const oldFetch=S.meta&&S.meta.last_fetch;
  S.all=d.items||[];S.meta=d.meta||{};
  try{localStorage.setItem(FEED_KEY,JSON.stringify(d))}catch(e){}
  return !oldFetch||oldFetch!==(S.meta.last_fetch||'');
}
function metaText(){
  const m=S.meta||{};
  $('#meta').textContent=`库内 ${m.total||0} 个项目 · 上次抓货 ${m.last_fetch||'-'}`;
  const old=+(localStorage.ag_total||0);
  if(!old)localStorage.ag_total=m.total||0;
  else setBadge((m.total||0)-old);
  if(!S._probed){S._probed=1;autoLink(m)}
}

/* 抓新货：触发云端抓取（Pages Function / 本地 server 提供），完成后自动重载数据 */
$('#refresh').onclick=async()=>{
  const b=$('#refresh');b.textContent='抓取中…';
  let ok=false;
  try{const r=await fetch('/api/refresh',{method:'POST'});const d=await r.json();ok=r.ok&&!d.error}
  catch(e){}
  if(!ok){b.textContent='↻ 抓新货';alert('抓取服务不可用：静态部署需启用 Pages Function 并配置 GitHub 令牌');return}
  let n=0;const t=setInterval(async()=>{
    n++;
    try{const s=await (await fetch('/api/refresh/status')).json();
      if(s.running===false){clearInterval(t);await loadFeed();metaText();reset();b.textContent='↻ 抓新货';return}
    }catch(e){}
    if(n>40){clearInterval(t);b.textContent='↻ 抓新货'}
  },15000);
};

/* 下拉到底自动续铺 */
new IntersectionObserver(es=>{if(es[0].isIntersecting)renderPage()},{rootMargin:'400px'}).observe($('#sentinel'));

/* 启动：有缓存先秒开，再后台拉新 */
(async()=>{
  applyFs();
  const had=loadCached();
  if(had){metaText();reset()}
  let changed=false;
  try{changed=await loadFeed()}catch(e){if(!had){$('#sentinel').textContent='数据加载失败，请刷新重试';return}}
  if(!had||changed){const y=window.scrollY;metaText();reset();if(had)window.scrollTo(0,y)}
})();
</script>
