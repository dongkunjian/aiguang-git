# 云主机上的隧道配置模板 —— 部署时复制成 ./cf-creds/config.yml
#
# 与本地 .cloudflared/config.yml 的唯一区别：凭据文件路径改成了「容器内路径」。
# 因为 docker-compose 把 ./cf-creds 挂进容器的 /etc/cloudflared，所以容器里看到的是 /etc/cloudflared/xxx.json。
#
# cf-creds/ 目录里最终应有两个文件（都不入库）：
#   config.yml                          ← 本模板
#   ec924b25-550f-4ce8-9e44-407833eb9f51.json   ← 从本机 C:\Users\dongk\.cloudflared\ 拷来
tunnel: ec924b25-550f-4ce8-9e44-407833eb9f51
credentials-file: /etc/cloudflared/ec924b25-550f-4ce8-9e44-407833eb9f51.json
ingress:
  - hostname: gogit.dongkunjian.ccwu.cc
    service: http://127.0.0.1:8321
  - service: http_status:404
